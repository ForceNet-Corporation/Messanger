<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForceNet</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

<div id="loginPage" class="page active">
    <div class="auth-container">
        <div class="auth-box">
            <h1 class="auth-title">FORCENET</h1>
            <p class="auth-subtitle">Вход в мессенджер</p>
            <form id="loginForm">
                <div class="input-group">
                    <label>Почта</label>
                    <input type="email" id="loginEmail" placeholder="example@mail.com" required>
                </div>
                <div class="input-group">
                    <label>Пароль</label>
                    <input type="password" id="loginPassword" placeholder="Введите пароль" required>
                </div>
                <button type="submit" class="btn-primary">Войти</button>
            </form>
            <div class="auth-divider">или</div>
            <button onclick="showRegister()" class="btn-secondary">Создать аккаунт</button>
            <div id="loginError" class="error-message"></div>
        </div>
    </div>
</div>

<div id="registerPage" class="page">
    <div class="auth-container">
        <div class="auth-box">
            <h1 class="auth-title">FORCENET</h1>
            <p class="auth-subtitle">Регистрация</p>
            <form id="registerForm">
                <div class="input-group">
                    <label>Имя</label>
                    <input type="text" id="registerName" placeholder="Иван Иванов" required>
                </div>
                <div class="input-group">
                    <label>Почта</label>
                    <input type="email" id="registerEmail" placeholder="example@mail.com" required>
                </div>
                <div class="input-group">
                    <label>Пароль (мин. 6 символов)</label>
                    <input type="password" id="registerPassword" placeholder="Минимум 6 символов" required minlength="6">
                </div>
                <div class="input-group">
                    <label>Пол</label>
                    <select id="registerGender">
                        <option value="male">Мужской</option>
                        <option value="female">Женский</option>
                        <option value="other">Другой</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Зарегистрироваться</button>
            </form>
            <div class="auth-divider">уже есть аккаунт?</div>
            <button onclick="showLogin()" class="btn-secondary">Войти</button>
            <div id="registerError" class="error-message"></div>
        </div>
    </div>
</div>

<div id="chatPage" class="page">
    <div class="chat-container">
        
        <div class="chat-sidebar" id="chatSidebar">
            <div class="sidebar-header">
                <div class="user-info" onclick="toggleProfile()">
                    <div class="avatar" id="userAvatar">U</div>
                    <span id="userNameDisplay">Пользователь</span>
                </div>
                <button onclick="logout()" class="logout-btn" title="Выйти">X</button>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Поиск пользователей..." oninput="searchUsers(this.value)">
            </div>
            <div class="chat-list" id="chatList"></div>
        </div>
        
        <div class="chat-main">
            <div class="chat-header" id="chatHeader">
                <div class="chat-user-info">
                    <div class="avatar" id="chatAvatar">U</div>
                    <span id="chatUserName">Выберите чат</span>
                </div>
                <div class="chat-actions">
                    <button onclick="clearChat()" class="action-btn" title="Очистить чат">C</button>
                    <button onclick="toggleSidebar()" class="action-btn" id="menuToggle" title="Меню">M</button>
                </div>
            </div>
            <div class="messages-area" id="messagesArea"></div>
            <div class="message-input-area">
                <div class="input-tools">
                    <button onclick="document.getElementById('fileInput').click()" class="tool-btn" title="Файл">+</button>
                    <input type="file" id="fileInput" multiple style="display:none" onchange="handleFileUpload(this.files)">
                </div>
                <div class="input-wrapper">
                    <textarea id="messageInput" placeholder="Введите сообщение..." rows="1" oninput="autoResize(this)" onkeydown="handleEnter(event)"></textarea>
                </div>
                <button onclick="sendMessage()" class="send-btn" id="sendBtn">></button>
            </div>
        </div>
        
    </div>
</div>

<div id="profileModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Профиль</h2>
            <button onclick="closeProfile()" class="close-btn">X</button>
        </div>
        <div class="modal-body">
            <div class="profile-avatar" id="profileAvatar">U</div>
            <div class="profile-field">
                <label>Имя</label>
                <input type="text" id="profileName" placeholder="Ваше имя">
            </div>
            <div class="profile-field">
                <label>Ваш ID</label>
                <input type="text" id="profileId" readonly>
            </div>
            <div class="profile-field">
                <label>Почта</label>
                <input type="text" id="profileEmail" readonly>
            </div>
            <div class="profile-field">
                <label>Тема</label>
                <select id="themeSelect" onchange="changeTheme(this.value)">
                    <option value="light">Светлая</option>
                    <option value="gray">Серая</option>
                    <option value="dark">Тёмная</option>
                </select>
            </div>
            <button onclick="saveProfile()" class="btn-primary">Сохранить</button>
            <button onclick="logout()" class="btn-danger">Выйти</button>
        </div>
    </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
